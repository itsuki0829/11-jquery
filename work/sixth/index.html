<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../common/css/reset.css" />
    <link rel="stylesheet" href="../../common/css/base.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>

  <body>
    <div class="wrapper" id="wrapper">
      <button type="button" class="btn search-btn" id="pokemon_search">
        ポケモンを探す
      </button>
    </div>
    <script src="../../common/js/jquery.js"></script>
    <script>
      // 「捕まえる」失敗時の画面表示
      let failHtml = `
        <p class="text">逃げられてしまった...</p>
        <button class="btn mt" data-js="reset">戻る</button>
      `;

      // 「ポケモンを探す」後の画面表示
      let encountHtml = `
        <p class="name"></p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <div>
          <button class="btn" id="catch">捕まえる</button>
          <button class="btn" data-js="reset">逃げる</button>
        </div>
      `;

      // 「捕まえる」成功時の画面表示
      let doneHtml = `
        <p class="name">ゲットしました</p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <button class="btn" data-js="reset">戻る</button>
      `;

      let resetHtml = `
        <button type="button" class="btn search-btn" id="pokemon_search">
          ポケモンを探す
        </button>
      `;

      let errorHtml = `
        <p class="text">データの取得に失敗しました。</p>
        <button class="btn mt" data-js="reset">戻る</button>
      `;

      function searchPokemon() {
        let pokemonId = Math.floor(Math.random() * 151) + 1;

        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${pokemonId}`,
          method: "GET",
        }).done(function (res) {
          $("#wrapper").html(encountHtml);
          $(".img").attr("src", res.sprites.front_default);

          $.ajax({
            url: `https://pokeapi.co/api/v2/pokemon-species/${pokemonId}`,
            method: "GET",
          })
            .done(function (speciesRes) {
              let japaneseName = speciesRes.names.find(function (name) {
                return name.language.name === "ja";
              });

              $(".name").text(japaneseName.name);
            })
            .fail(function (err) {
              console.log(err);
              $("#wrapper").html(errorHtml);
            });
        });
      }

      function catchPokemon() {
        let random = Math.floor(Math.random() * 2);

        if (random === 0) {
          $("#wrapper").html(doneHtml);

          $(".img").attr(
            "src",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png",
          );
        } else {
          $("#wrapper").html(failHtml);
        }
      }

      function resetScreen() {
        $("#wrapper").html(resetHtml);
      }

      $(document).on("click", "#pokemon_search", searchPokemon);
      $(document).on("click", "#catch", catchPokemon);
      $(document).on("click", '[data-js="reset"]', resetScreen);
    </script>
  </body>
</html>
